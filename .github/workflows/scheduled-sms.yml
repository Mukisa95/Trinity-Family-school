name: Send scheduled SMS

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-scheduled-sms:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger scheduled SMS dispatch
        env:
          DEFAULT_APP_URL: https://trinityfamilyschool.vercel.app
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL:-$DEFAULT_APP_URL}"
          BASE_URL="${BASE_URL%/}"
          ENDPOINT="$BASE_URL/api/cron/send-scheduled-sms"

          if [ -n "${CRON_SECRET:-}" ]; then
            curl --fail --show-error --silent --location \
              --header "Authorization: Bearer $CRON_SECRET" \
              "$ENDPOINT"
          else
            curl --fail --show-error --silent --location "$ENDPOINT"
          fi
