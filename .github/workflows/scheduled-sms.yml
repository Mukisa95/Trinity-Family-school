name: Send scheduled communications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      action:
        description: "Run the due-job dispatcher or the one-time scheduler migration"
        required: true
        default: dispatch
        type: choice
        options:
          - dispatch
          - migrate
          - migrate-ganda

jobs:
  send-scheduled-communications:
    if: github.event_name != 'workflow_dispatch' || (inputs.action != 'migrate' && inputs.action != 'migrate-ganda')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger unified due-job dispatch
        env:
          DEFAULT_APP_URL: https://trinityfamilyschool.vercel.app
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL:-$DEFAULT_APP_URL}"
          BASE_URL="${BASE_URL%/}"
          DISPATCH_ENDPOINT="$BASE_URL/api/cron/send-scheduled-sms"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is required for scheduled communication dispatch."
            exit 1
          fi

          curl --fail --show-error --silent --location \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$DISPATCH_ENDPOINT"

  send-ganda-scheduled-communications:
    if: github.event_name != 'workflow_dispatch' || (inputs.action != 'migrate' && inputs.action != 'migrate-ganda')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger Ganda unified due-job dispatch
        env:
          DEFAULT_APP_URL: https://gandalocked.vercel.app
          APP_URL: ${{ vars.GANDA_APP_URL }}
          CRON_SECRET: ${{ secrets.GANDA_CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL:-$DEFAULT_APP_URL}"
          BASE_URL="${BASE_URL%/}"
          DISPATCH_ENDPOINT="$BASE_URL/api/cron/send-scheduled-sms"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "GANDA_CRON_SECRET is required for scheduled communication dispatch."
            exit 1
          fi

          curl --fail --show-error --silent --location \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$DISPATCH_ENDPOINT"

  backfill-scheduled-communications:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'migrate'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one-time scheduler migration
        env:
          DEFAULT_APP_URL: https://trinityfamilyschool.vercel.app
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL:-$DEFAULT_APP_URL}"
          BASE_URL="${BASE_URL%/}"
          MIGRATION_ENDPOINT="$BASE_URL/api/admin/scheduler/backfill"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is required for the scheduler migration."
            exit 1
          fi

          curl --fail --show-error --silent --location --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MIGRATION_ENDPOINT"

  backfill-ganda-scheduled-communications:
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'migrate-ganda'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run one-time Ganda scheduler migration
        env:
          DEFAULT_APP_URL: https://gandalocked.vercel.app
          APP_URL: ${{ vars.GANDA_APP_URL }}
          CRON_SECRET: ${{ secrets.GANDA_CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL:-$DEFAULT_APP_URL}"
          BASE_URL="${BASE_URL%/}"
          MIGRATION_ENDPOINT="$BASE_URL/api/admin/scheduler/backfill"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "GANDA_CRON_SECRET is required for the scheduler migration."
            exit 1
          fi

          curl --fail --show-error --silent --location --request POST \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$MIGRATION_ENDPOINT"
