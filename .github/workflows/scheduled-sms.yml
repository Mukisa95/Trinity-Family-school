name: Send scheduled communications

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  send-scheduled-communications:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger unified due-job dispatch
        env:
          DEFAULT_APP_URL: https://trinityfamilyschool.vercel.app
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -euo pipefail

          BASE_URL="${APP_URL:-$DEFAULT_APP_URL}"
          BASE_URL="${BASE_URL%/}"
          DISPATCH_ENDPOINT="$BASE_URL/api/cron/send-scheduled-sms"

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET is required for scheduled communication dispatch."
            exit 1
          fi

          curl --fail --show-error --silent --location \
            --header "Authorization: Bearer $CRON_SECRET" \
            "$DISPATCH_ENDPOINT"
